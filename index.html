<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartas a Cata</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #faf9f7;
      --text: #1a1916;
      --text-soft: #6b6760;
      --text-lighter: #a8a49f;
      --border: #e8e5e0;
      --max: 680px;
    }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-weight: 300; line-height: 1.6; min-height: 100vh; }
    header { padding: 4rem 2rem 3rem; max-width: var(--max); margin: 0 auto; border-bottom: 1px solid var(--border); }
    .blog-label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-lighter); margin-bottom: 1.25rem; }
    header h1 { font-family: 'Cormorant Garamond', serif; font-size: clamp(2.2rem, 6vw, 3rem); font-weight: 300; line-height: 1.15; margin-bottom: 1rem; }
    header h1 em { font-style: italic; color: var(--text-soft); }
    .header-desc { font-size: 15px; color: var(--text-soft); max-width: 420px; line-height: 1.7; }
    main { max-width: var(--max); margin: 0 auto; padding: 0 2rem 6rem; }

    /* VIEWS */
    #view-list, #view-new, #view-single { display: none; }
    #view-list.active, #view-new.active, #view-single.active { display: block; }

    /* LIST */
    .entries { margin-top: 3rem; }
    .new-btn { margin-top: 2.5rem; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-lighter); background: none; border: 0.5px solid var(--border); border-radius: 4px; padding: 8px 16px; cursor: pointer; transition: all 0.2s; font-family: 'DM Sans', sans-serif; }
    .new-btn:hover { color: var(--text); border-color: var(--text-soft); }
    .entry { padding: 2.5rem 0; border-bottom: 1px solid var(--border); cursor: pointer; transition: opacity 0.2s; }
    .entry:hover { opacity: 0.7; }
    .entry-meta { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.75rem; }
    .entry-num { font-family: 'Cormorant Garamond', serif; font-size: 13px; color: var(--text-lighter); font-style: italic; }
    .entry-date { font-size: 12px; letter-spacing: 0.06em; color: var(--text-lighter); text-transform: uppercase; }
    .entry h2 { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; font-weight: 400; margin-bottom: 0.6rem; line-height: 1.3; }
    .entry-preview { font-size: 14px; color: var(--text-soft); line-height: 1.75; max-width: 520px; }
    .empty-state { padding: 3rem 0; color: var(--text-lighter); font-size: 15px; font-style: italic; font-family: 'Cormorant Garamond', serif; }

    /* SINGLE */
    .back-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-lighter); background: none; border: none; cursor: pointer; padding: 0; margin: 2.5rem 0 3rem; letter-spacing: 0.04em; transition: color 0.2s; font-family: 'DM Sans', sans-serif; }
    .back-btn:hover { color: var(--text); }
    .single-meta { margin-bottom: 2.5rem; }
    .single-label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-lighter); margin-bottom: 0.75rem; }
    .single h1 { font-family: 'Cormorant Garamond', serif; font-size: clamp(1.8rem, 5vw, 2.5rem); font-weight: 300; line-height: 1.2; margin-bottom: 0.5rem; }
    .single-date { font-size: 13px; color: var(--text-lighter); }
    .divider { width: 40px; height: 1px; background: var(--border); margin: 2.5rem 0; }
    .single-body { font-family: 'Cormorant Garamond', serif; font-size: 1.15rem; line-height: 1.95; color: var(--text); }
    .single-body p { margin-bottom: 1.5rem; }
    .single-actions { margin-top: 3rem; display: flex; gap: 1rem; }
    .btn-delete { font-size: 13px; color: var(--text-lighter); background: none; border: none; cursor: pointer; padding: 0; font-family: 'DM Sans', sans-serif; transition: color 0.2s; }
    .btn-delete:hover { color: #c0392b; }

    /* NEW ENTRY FORM */
    .form-wrap { padding-top: 2.5rem; }
    .form-label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-lighter); margin-bottom: 0.5rem; display: block; }
    .form-title { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; font-weight: 300; width: 100%; border: none; background: none; color: var(--text); outline: none; border-bottom: 1px solid var(--border); padding-bottom: 0.75rem; margin-bottom: 2rem; }
    .form-title::placeholder { color: var(--text-lighter); }
    .form-body { font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; line-height: 1.9; width: 100%; min-height: 400px; border: none; background: none; color: var(--text); outline: none; resize: none; }
    .form-body::placeholder { color: var(--text-lighter); }
    .form-actions { margin-top: 2rem; display: flex; gap: 1rem; align-items: center; border-top: 1px solid var(--border); padding-top: 1.5rem; }
    .btn-save { font-size: 13px; color: var(--text); background: none; border: 0.5px solid var(--border); border-radius: 4px; padding: 8px 20px; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.2s; }
    .btn-save:hover { border-color: var(--text-soft); }
    .btn-cancel { font-size: 13px; color: var(--text-lighter); background: none; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; }
    @media (max-width: 480px) { header, main { padding-left: 1.25rem; padding-right: 1.25rem; } }
  </style>
</head>
<body>

<header>
  <p class="blog-label">Diario privado</p>
  <h1>Cartas a <em>Cata</em></h1>
  <p class="header-desc">Un espacio para entenderme. Escrito para ti, construido para mí.</p>
</header>

<main>

  <div id="view-list" class="active">
    <div class="entries" id="entries-container"></div>
    <button class="new-btn" onclick="showNew()">+ Nueva entrada</button>
  </div>

  <div id="view-single">
    <button class="back-btn" onclick="showList()">← Volver</button>
    <div class="single">
      <div class="single-meta">
        <p class="single-label" id="s-label"></p>
        <h1 id="s-title"></h1>
        <p class="single-date" id="s-date"></p>
      </div>
      <div class="divider"></div>
      <div class="single-body" id="s-body"></div>
      <div class="single-actions">
        <button class="btn-delete" onclick="deleteEntry()">Eliminar entrada</button>
      </div>
    </div>
  </div>

  <div id="view-new">
    <button class="back-btn" onclick="showList()">← Volver</button>
    <div class="form-wrap">
      <label class="form-label">Título</label>
      <input class="form-title" id="f-title" type="text" placeholder="El título de esta entrada..." autocomplete="off">
      <label class="form-label">Carta</label>
      <textarea class="form-body" id="f-body" placeholder="Catacoco,&#10;&#10;..."></textarea>
      <div class="form-actions">
        <button class="btn-save" onclick="saveEntry()">Guardar entrada</button>
        <button class="btn-cancel" onclick="showList()">Cancelar</button>
      </div>
    </div>
  </div>

</main>

<script>
  const STORAGE_KEY = 'cartas-a-cata';
  let entries = [];
  let currentIndex = null;

  const SEED = [
    {
      id: 'entry-0',
      num: '00',
      date: '8 de mayo, 2026',
      title: 'El origen — todo lo que descubrí',
      body: `Catacoco, esto no es una carta de amor, aunque tiene amor. Es el mapa de todo lo que no supe ver mientras lo tenía enfrente. Lo escribo aquí, para mí, para entenderme — aunque lo dirija a ti.

Descubrí que tengo una herida de rechazo que operaba sin que yo lo supiera. Durante mucho tiempo interpreté situaciones como rechazo aunque no lo fueran, y reaccionaba desde el miedo en lugar del amor. Cada vez que sentía que no podías recibirme, esa herida se activaba y yo respondía desde un lugar oscuro que ni siquiera reconocía como mío.

Entendí también que el TDAH combinado con mi impulsividad me hacía hacer y decir cosas que yo no quería. Muchas veces me sentí traicionándome — traicionándonos — sin entender por qué no podía parar. Cuando te decía que estaba reventado, era verdad. No era una excusa. Era impulsividad desbordada mezclada con la necesidad de apagar mis propias heridas.

Hubo una conversación en mi carro en la que por fin lo vi con claridad. Entendí el daño que te hice. Y eso cambió cómo me veo a mí mismo, aunque ya no cambie nada entre nosotros.

Descubrí algo más duro: muchos reproches que te hacía eran reproches que me estaba haciendo a mí mismo. Lo que creía que eras tú, era yo, proyectado en ti. Tenía una búsqueda de aprobación externa que me impedía mostrarme vulnerable. En lugar de decirte "estoy estallado, ¿qué hacemos?", me alejaba por miedo y vergüenza.

Cargaba cargas que no eran mías — o que eran mías pero no podía seguir cargando — y eso me impedía verte, escucharte, darte tu lugar. Te dejé sola sosteniendo una relación que los dos queríamos construir juntos. No fue consciente. Pero fue real.

En nuestras últimas conversaciones tú me decías algo muy claro y yo escuchaba otra cosa completamente diferente. No por mala fe. Porque mis heridas distorsionaban todo lo que recibía. Cada vez que te abriste, pediste perdón u ofreciste una conversación difícil, esos eran tus regalos. Y yo no supe recibirlos.

Una relación es de dos, y los dos pusimos lo que pudimos. Pero hoy identifico con claridad que fui yo quien no supo transformarse en lo que quería ser. Tú siempre diste todo. Yo apenas hoy puedo verlo.

Lo que quiero trabajar desde aquí: entender y sanar la herida de rechazo. Aprender a decir "estoy estallado" en lugar de alejarme. Controlar la impulsividad. Soltar las cargas que no son mías. Desarrollar la introspección que me faltó.

Este blog es ese trabajo. Escrito para ti, construido para mí.`
    },
    {
      id: 'entry-1',
      num: '01',
      date: '22 de mayo, 2026',
      title: 'Un amor bonito — y la pregunta sin respuesta',
      body: `Catacoco, encontré este libro y lo primero que pensé fue en ti. "Un amor bonito" de Efrén Martínez. Lo compré para dártelo y me di cuenta de que lo necesito leer yo también.

Hoy estoy en un lugar más tranquilo que hace unas semanas. He estado enfermo, he estado solo, he estado pensándote todo el día. Y sin embargo no te he contactado — no porque no quiera, sino porque estoy aprendiendo a distinguir cuándo el impulso habla y cuándo habla algo más profundo.

Hay una pregunta que me ronda y que todavía no sé responderme: si ya identifico lo que hay, si ya estoy trabajando en mis dificultades, ¿por qué no hacerlo juntos? El espejo que eres para mí es muy importante. Construir junto a alguien se siente más fácil que construirse solo.

Pero también me cuestiono: ¿qué tan duro sería estar ahí y seguir con la misma dinámica? ¿Tengo las herramientas todavía? ¿Estaría llegando a ti desde el amor o desde la necesidad?

No tengo respuesta hoy. Y creo que eso está bien. Lo que sí sé es que el trabajo que estoy haciendo no es para recuperarte — es para convertirme en el ser humano que quiero ser. Y que si algún día hay un nosotros de nuevo, quiero llegar desde ese lugar, no desde este.

Gracias por tu carcajada. Por los abrazos del alma que prometiste. Por haber aparecido en mi cumpleaños aunque no sabías si debías. Eso también fue un regalo que esta vez sí supe recibir.`
    }
  ];

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      entries = raw ? JSON.parse(raw) : [...SEED];
    } catch(e) {
      entries = [...SEED];
    }
    renderList();
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); } catch(e) {}
  }

  function renderList() {
    const c = document.getElementById('entries-container');
    if (entries.length === 0) {
      c.innerHTML = '<p class="empty-state">Aún no hay entradas. Escribe la primera.</p>';
      return;
    }
    c.innerHTML = entries.map((e, i) => `
      <div class="entry" onclick="openEntry(${i})">
        <div class="entry-meta">
          <span class="entry-num">${e.num || String(i).padStart(2,'0')}</span>
          <span class="entry-date">${e.date}</span>
        </div>
        <h2>${e.title}</h2>
        <p class="entry-preview">${e.body.substring(0, 120).trim()}...</p>
      </div>
    `).join('');
  }

  function openEntry(i) {
    currentIndex = i;
    const e = entries[i];
    document.getElementById('s-label').textContent = `Entrada ${e.num || String(i).padStart(2,'0')} · ${e.date}`;
    document.getElementById('s-title').textContent = e.title;
    document.getElementById('s-date').textContent = '';
    document.getElementById('s-body').innerHTML = e.body.split('\n\n').filter(p => p.trim()).map(p => `<p>${p.trim()}</p>`).join('');
    show('view-single');
  }

  function deleteEntry() {
    if (!confirm('¿Eliminar esta entrada?')) return;
    entries.splice(currentIndex, 1);
    save();
    renderList();
    showList();
  }

  function showNew() { show('view-new'); document.getElementById('f-title').value = ''; document.getElementById('f-body').value = ''; }
  function showList() { show('view-list'); renderList(); window.scrollTo({top:0,behavior:'smooth'}); }

  function saveEntry() {
    const title = document.getElementById('f-title').value.trim();
    const body = document.getElementById('f-body').value.trim();
    if (!title || !body) { alert('Escribe un título y el contenido.'); return; }
    const now = new Date();
    const months = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    const date = `${now.getDate()} de ${months[now.getMonth()]}, ${now.getFullYear()}`;
    const num = String(entries.length).padStart(2,'0');
    entries.push({ id: `entry-${Date.now()}`, num, date, title, body });
    save();
    showList();
  }

  function show(id) {
    ['view-list','view-new','view-single'].forEach(v => {
      document.getElementById(v).classList.toggle('active', v === id);
    });
    window.scrollTo({top:0,behavior:'smooth'});
  }

  load();
</script>
</body>
</html>
