<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartas a Cata</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #faf9f7;
      --text: #1a1916;
      --text-soft: #6b6760;
      --text-lighter: #a8a49f;
      --border: #e8e5e0;
      --max: 680px;
    }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-weight: 300; line-height: 1.6; min-height: 100vh; }
    header { padding: 4rem 2rem 3rem; max-width: var(--max); margin: 0 auto; border-bottom: 1px solid var(--border); }
    .blog-label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-lighter); margin-bottom: 1.25rem; }
    header h1 { font-family: 'Cormorant Garamond', serif; font-size: clamp(2.2rem, 6vw, 3rem); font-weight: 300; line-height: 1.15; margin-bottom: 1rem; }
    header h1 em { font-style: italic; color: var(--text-soft); }
    .header-desc { font-size: 15px; color: var(--text-soft); max-width: 420px; line-height: 1.7; }
    main { max-width: var(--max); margin: 0 auto; padding: 0 2rem 6rem; }

    #view-list, #view-new, #view-single, #view-login { display: none; }
    #view-list.active, #view-new.active, #view-single.active, #view-login.active { display: block; }

    .entries { margin-top: 3rem; }
    .admin-btn { margin-top: 2.5rem; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-lighter); background: none; border: 0.5px solid var(--border); border-radius: 4px; padding: 8px 16px; cursor: pointer; transition: all 0.2s; font-family: 'DM Sans', sans-serif; }
    .admin-btn:hover { color: var(--text); border-color: var(--text-soft); }
    .entry { padding: 2.5rem 0; border-bottom: 1px solid var(--border); cursor: pointer; transition: opacity 0.2s; }
    .entry:hover { opacity: 0.7; }
    .entry-meta { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.75rem; }
    .entry-num { font-family: 'Cormorant Garamond', serif; font-size: 13px; color: var(--text-lighter); font-style: italic; }
    .entry-date { font-size: 12px; letter-spacing: 0.06em; color: var(--text-lighter); text-transform: uppercase; }
    .entry h2 { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; font-weight: 400; margin-bottom: 0.6rem; line-height: 1.3; }
    .entry-preview { font-size: 14px; color: var(--text-soft); line-height: 1.75; max-width: 520px; }
    .empty-state { padding: 3rem 0; color: var(--text-lighter); font-size: 15px; font-style: italic; font-family: 'Cormorant Garamond', serif; }
    .loading-state { padding: 3rem 0; color: var(--text-lighter); font-size: 14px; }

    .back-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-lighter); background: none; border: none; cursor: pointer; padding: 0; margin: 2.5rem 0 3rem; letter-spacing: 0.04em; transition: color 0.2s; font-family: 'DM Sans', sans-serif; }
    .back-btn:hover { color: var(--text); }
    .single-meta { margin-bottom: 2.5rem; }
    .single-label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-lighter); margin-bottom: 0.75rem; }
    .single h1 { font-family: 'Cormorant Garamond', serif; font-size: clamp(1.8rem, 5vw, 2.5rem); font-weight: 300; line-height: 1.2; margin-bottom: 0.5rem; }
    .single-date { font-size: 13px; color: var(--text-lighter); }
    .divider { width: 40px; height: 1px; background: var(--border); margin: 2.5rem 0; }
    .single-body { font-family: 'Cormorant Garamond', serif; font-size: 1.15rem; line-height: 1.95; color: var(--text); }
    .single-body p { margin-bottom: 1.5rem; }
    .single-actions { margin-top: 3rem; display: flex; gap: 1rem; }
    .btn-delete { font-size: 13px; color: var(--text-lighter); background: none; border: none; cursor: pointer; padding: 0; font-family: 'DM Sans', sans-serif; transition: color 0.2s; display: none; }
    .btn-delete.visible { display: inline; }
    .btn-delete:hover { color: #c0392b; }

    .form-wrap { padding-top: 2.5rem; }
    .form-label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-lighter); margin-bottom: 0.5rem; display: block; }
    .form-title { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; font-weight: 300; width: 100%; border: none; background: none; color: var(--text); outline: none; border-bottom: 1px solid var(--border); padding-bottom: 0.75rem; margin-bottom: 2rem; }
    .form-title::placeholder { color: var(--text-lighter); }
    .form-body { font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; line-height: 1.9; width: 100%; min-height: 400px; border: none; background: none; color: var(--text); outline: none; resize: none; }
    .form-body::placeholder { color: var(--text-lighter); }
    .form-actions { margin-top: 2rem; display: flex; gap: 1rem; align-items: center; border-top: 1px solid var(--border); padding-top: 1.5rem; }
    .btn-save { font-size: 13px; color: var(--text); background: none; border: 0.5px solid var(--border); border-radius: 4px; padding: 8px 20px; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.2s; }
    .btn-save:hover { border-color: var(--text-soft); }
    .btn-cancel { font-size: 13px; color: var(--text-lighter); background: none; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; }

    .login-wrap { padding-top: 3rem; max-width: 320px; }
    .login-wrap h2 { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; font-weight: 300; margin-bottom: 2rem; color: var(--text-soft); }
    .login-input { width: 100%; border: none; border-bottom: 1px solid var(--border); background: none; font-family: 'DM Sans', sans-serif; font-size: 15px; color: var(--text); padding: 0.5rem 0; outline: none; margin-bottom: 1.5rem; }
    .login-input::placeholder { color: var(--text-lighter); }
    .login-error { font-size: 13px; color: #c0392b; margin-top: 0.5rem; display: none; }

    @media (max-width: 480px) { header, main { padding-left: 1.25rem; padding-right: 1.25rem; } }
  </style>
</head>
<body>

<header>
  <p class="blog-label">Diario privado</p>
  <h1>Cartas a <em>Cata</em></h1>
  <p class="header-desc">Un espacio para entenderme. Escrito para ti, construido para mí.</p>
</header>

<main>

  <div id="view-list" class="active">
    <div class="entries" id="entries-container">
      <p class="loading-state">Cargando entradas...</p>
    </div>
    <button class="admin-btn" onclick="showLogin()">+ Nueva entrada</button>
  </div>

  <div id="view-login">
    <button class="back-btn" onclick="showList()">← Volver</button>
    <div class="login-wrap">
      <h2>Acceso de edición</h2>
      <input class="login-input" id="pwd-input" type="password" placeholder="Contraseña" onkeydown="if(event.key==='Enter')checkLogin()">
      <button class="btn-save" onclick="checkLogin()">Entrar</button>
      <p class="login-error" id="login-error">Contraseña incorrecta.</p>
    </div>
  </div>

  <div id="view-new">
    <button class="back-btn" onclick="showList()">← Volver</button>
    <div class="form-wrap">
      <label class="form-label">Título</label>
      <input class="form-title" id="f-title" type="text" placeholder="El título de esta entrada..." autocomplete="off">
      <label class="form-label">Carta</label>
      <textarea class="form-body" id="f-body" placeholder="Catacoco,&#10;&#10;..."></textarea>
      <div class="form-actions">
        <button class="btn-save" onclick="saveEntry()">Guardar entrada</button>
        <button class="btn-cancel" onclick="showList()">Cancelar</button>
      </div>
    </div>
  </div>

  <div id="view-single">
    <button class="back-btn" onclick="showList()">← Volver</button>
    <div class="single">
      <div class="single-meta">
        <p class="single-label" id="s-label"></p>
        <h1 id="s-title"></h1>
        <p class="single-date" id="s-date"></p>
      </div>
      <div class="divider"></div>
      <div class="single-body" id="s-body"></div>
      <div class="single-actions">
        <button class="btn-delete" id="btn-delete" onclick="deleteEntry()">Eliminar entrada</button>
      </div>
    </div>
  </div>

</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, orderBy, query } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCCCw7acJbJwggKqrgbkg5NxKKL3-GNW9c",
    authDomain: "cartas-a-cata.firebaseapp.com",
    projectId: "cartas-a-cata",
    storageBucket: "cartas-a-cata.firebasestorage.app",
    messagingSenderId: "542528496840",
    appId: "1:542528496840:web:c3129469ee62a0afa6f1fd"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const PASSWORD = "Ngomezs8*";
  let isAdmin = false;
  let entries = [];
  let currentId = null;

  const months = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

  function formatDate(ts) {
    const d = ts ? new Date(ts) : new Date();
    return `${d.getDate()} de ${months[d.getMonth()]}, ${d.getFullYear()}`;
  }

  async function loadEntries() {
    try {
      const q = query(collection(db, "entradas"), orderBy("createdAt", "asc"));
      const snap = await getDocs(q);
      entries = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderList();
    } catch(e) {
      document.getElementById('entries-container').innerHTML = '<p class="empty-state">No se pudieron cargar las entradas.</p>';
    }
  }

  function renderList() {
    const c = document.getElementById('entries-container');
    if (entries.length === 0) {
      c.innerHTML = '<p class="empty-state">Aún no hay entradas. Escribe la primera.</p>';
      return;
    }
    c.innerHTML = entries.map((e, i) => `
      <div class="entry" onclick="window._openEntry('${e.id}')">
        <div class="entry-meta">
          <span class="entry-num">${String(i).padStart(2,'0')}</span>
          <span class="entry-date">${formatDate(e.createdAt)}</span>
        </div>
        <h2>${e.title}</h2>
        <p class="entry-preview">${e.body.substring(0, 120).trim()}...</p>
      </div>
    `).join('');
  }

  window._openEntry = function(id) {
    const e = entries.find(x => x.id === id);
    if (!e) return;
    currentId = id;
    const i = entries.indexOf(e);
    document.getElementById('s-label').textContent = `Entrada ${String(i).padStart(2,'0')} · ${formatDate(e.createdAt)}`;
    document.getElementById('s-title').textContent = e.title;
    document.getElementById('s-date').textContent = '';
    document.getElementById('s-body').innerHTML = e.body.split('\n\n').filter(p => p.trim()).map(p => `<p>${p.trim()}</p>`).join('');
    const delBtn = document.getElementById('btn-delete');
    if (isAdmin) delBtn.classList.add('visible'); else delBtn.classList.remove('visible');
    show('view-single');
  };

  window.checkLogin = function() {
    const val = document.getElementById('pwd-input').value;
    if (val === PASSWORD) {
      isAdmin = true;
      document.getElementById('login-error').style.display = 'none';
      document.getElementById('pwd-input').value = '';
      show('view-new');
    } else {
      document.getElementById('login-error').style.display = 'block';
    }
  };

  window.saveEntry = async function() {
    const title = document.getElementById('f-title').value.trim();
    const body = document.getElementById('f-body').value.trim();
    if (!title || !body) { alert('Escribe un título y el contenido.'); return; }
    try {
      await addDoc(collection(db, "entradas"), { title, body, createdAt: Date.now() });
      document.getElementById('f-title').value = '';
      document.getElementById('f-body').value = '';
      await loadEntries();
      showList();
    } catch(e) { alert('Error al guardar. Intenta de nuevo.'); }
  };

  window.deleteEntry = async function() {
    if (!isAdmin) return;
    if (!confirm('¿Eliminar esta entrada?')) return;
    try {
      await deleteDoc(doc(db, "entradas", currentId));
      await loadEntries();
      showList();
    } catch(e) { alert('Error al eliminar.'); }
  };

  window.showList = function() { show('view-list'); window.scrollTo({top:0,behavior:'smooth'}); };
  window.showLogin = function() { show('view-login'); setTimeout(() => document.getElementById('pwd-input').focus(), 100); };

  function show(id) {
    ['view-list','view-new','view-single','view-login'].forEach(v => {
      document.getElementById(v).classList.toggle('active', v === id);
    });
    window.scrollTo({top:0,behavior:'smooth'});
  }

  loadEntries();
</script>

</body>
</html>
